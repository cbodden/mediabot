# mediabot configuration. Copy to config.toml and edit.
# Any value may reference an environment variable as ${NAME} (lines starting with # are
# ignored), which keeps secrets out of the file — handy with Docker env/secrets.

[irc]
server = "irc.libera.chat"
port = 6697
tls = true
nick = "mediabot"
# Register the nick with NickServ first, then authenticate with SASL PLAIN.
# Libera requires SASL for connections from many cloud/VPN ranges.
sasl_account = "mediabot"
sasl_password = "${MEDIABOT_SASL_PASSWORD}"
sasl_required = true
# default_role: what an unknown user (no ACL entry) gets when speaking in that channel.
#   "none" = ignored (default), "readonly" = can use read commands.
channels = [
  { name = "#my-media", default_role = "none" },
  # { name = "#private", key = "${CHAN_KEY}", default_role = "readonly" },
]
# Outgoing flood control (Libera is happy with ~1 line / 1.5s after a short burst).
flood_burst = 4
flood_interval_ms = 1500
rejoin_on_kick = true

[bot]
prefix = "!"
# NickServ ACCOUNT names (not nicks) that permanently own the bot. Owners can grant admin;
# admins can grant read-only. Runtime users are stored in data_dir/state.json.
owners = ["your-nickserv-account"]
# Role for unknown users in private messages.
default_role = "none"
max_lines = 8
data_dir = "data"
poll_interval_secs = 30  # sessions / queues / request counts
slow_poll_every = 20     # library counts & missing totals every 20 polls (10 min)
cooldown_ms = 2000       # per-user rate limit for non-admins

[web]
enabled = true
# Keep it on localhost unless it is behind TLS (set tls_cert/tls_key or a reverse proxy).
listen = "127.0.0.1:8088"
username = "admin"
password = "${MEDIABOT_WEB_PASSWORD}"
# tls_cert = "/etc/mediabot/cert.pem"
# tls_key = "/etc/mediabot/key.pem"
# Prometheus scrapes /metrics without auth by default; set true to require basic auth.
metrics_auth = false

[telemetry]
log_level = "info,mediabot=info"   # RUST_LOG overrides; use "debug" to see raw IRC traffic
json_logs = false
# Ship logs (including the audit trail of admin actions, target="audit") to Loki.
# [telemetry.loki]
# url = "http://loki:3100"
# labels = { env = "home" }
# username = "loki"
# password = "${LOKI_PASSWORD}"
# tenant = "home"

# ---------------------------------------------------------------------------------------
# Services. `kind` is one of: plex, emby, jellyfin, tautulli, seerr, sonarr, radarr, lidarr.
# `name` defaults to the kind; set it when you have two of the same kind (e.g. sonarr4k).
# Names double as IRC shorthand: "!sonarr4k queue", "!plex".
# ---------------------------------------------------------------------------------------

[[service]]
kind = "plex"
url = "http://plex:32400"
api_key = "${PLEX_TOKEN}"          # X-Plex-Token

[[service]]
kind = "jellyfin"
url = "http://jellyfin:8096"
api_key = "${JELLYFIN_API_KEY}"    # Dashboard → API Keys

[[service]]
kind = "emby"
url = "http://emby:8096"
api_key = "${EMBY_API_KEY}"

[[service]]
kind = "tautulli"
url = "http://tautulli:8181"
api_key = "${TAUTULLI_API_KEY}"

[[service]]
kind = "seerr"                      # Seerr / Overseerr / Jellyseerr
url = "http://seerr:5055"
api_key = "${SEERR_API_KEY}"

[[service]]
kind = "sonarr"
url = "http://sonarr:8989"
api_key = "${SONARR_API_KEY}"

[[service]]
kind = "radarr"
url = "http://radarr:7878"
api_key = "${RADARR_API_KEY}"

[[service]]
kind = "lidarr"
url = "http://lidarr:8686"
api_key = "${LIDARR_API_KEY}"
# verify_tls = false   # for self-signed backends
# timeout_secs = 10
