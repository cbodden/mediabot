# Example stack. Secrets come from .env next to this file (see config.example.toml for names).
# In the container the panel must listen on 0.0.0.0 — set `listen = "0.0.0.0:8088"` in
# config.toml and keep the published port bound to localhost (or put TLS in front).
services:
  mediabot:
    build: ..
    image: mediabot:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.toml:/config/config.toml:ro
      - mediabot-data:/data            # state.json (users + channels)
    ports:
      - "127.0.0.1:8088:8088"
volumes:
  mediabot-data:
